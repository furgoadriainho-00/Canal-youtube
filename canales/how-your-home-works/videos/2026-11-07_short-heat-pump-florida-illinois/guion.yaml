    tipo: mapa
    resaltar: {FL: frio, IL: calor}
    lineas: [Florida, '*vs* Illinois']
- t: In Florida, heating a typical home costs about four hundred thirty dollars a year with a new gas furnace,
  v: {tipo: numero, icono: local_fire_department, valor: 431, prefijo: $, sufijo: /yr, etiqueta: 'Florida: new gas furnace', color: calor}
- t: and about three hundred forty with a heat pump.
