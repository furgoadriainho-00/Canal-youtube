- t: In Illinois, it's about five hundred fifty-five with gas,
  v: {tipo: numero, icono: local_fire_department, valor: 556, prefijo: $, sufijo: /yr, etiqueta: 'Illinois: new gas furnace', color: calor}
- t: and about twelve hundred forty-five with a heat pump.
