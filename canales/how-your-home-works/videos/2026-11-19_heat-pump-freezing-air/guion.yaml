- t: So the outdoor air in winter isn't empty.
  v:
    tipo: casa
    foco: bomba_calor
    lineas:
    - Winter air
    - '*isn''t empty*'
- t: It's full of heat.
  v:
    tipo: iconos
    iconos:
    - air
    - heat
    etiquetas:
    - Outdoor air
    - Full of heat
- t: The problem is that it's at a lower temperature than your living room, and heat naturally flows from warm to cold, not the other way.
  v:
    tipo: formula
    partes:
    - Warm room
    - →
    - cold outside
- t: A heat pump's whole job is to make that heat flow uphill.
  v:
    tipo: formula
    partes:
    - Cold outside
    - →
    - warm room
    - '='
    - uphill
- t: 'Step two: grab the heat outside.'
  v:
    tipo: iconos
    iconos:
    - air
    etiquetas:
    - 'Step 2: grab the heat outside'
  capitulo: 'Step 2: grab the heat outside'
- t: A heat pump circulates a special fluid called a refrigerant through two coils, one outdoors and one indoors.
  v:
    tipo: casa
    foco: bomba_calor
    lineas:
    - Refrigerant,
    - '*two coils*'
- t: In the outdoor coil, the refrigerant is kept at very low pressure, which makes it even colder than the winter air around it.
  v:
    tipo: clip
    clip: aire
    lineas:
    - Low pressure
    - = *very cold*
- t: Because the refrigerant is colder than the air, heat flows from the air into the refrigerant.
  v:
    tipo: formula
    partes:
    - Winter air
    - →
    - colder refrigerant
- t: 'That''s the normal direction: warm to cold.'
  v:
    tipo: iconos
    iconos:
    - heat
    - ac_unit
    etiquetas:
    - Warm
    - → cold
- t: As it soaks up that heat, the refrigerant boils and turns into a gas.
  v:
    tipo: formula
    partes:
    - Liquid
    - + heat
    - →
    - gas
- t: That's the trick.
  v:
    tipo: iconos
    iconos:
    - bubble_chart
    etiquetas:
    - 'The trick: boiling'
- t: Boiling absorbs a lot of energy, so the gas now carries the heat it took from outside.
  v:
    tipo: iconos
    iconos:
    - bubble_chart
    - heat
    etiquetas:
    - Gas
    - Carries the heat
- t: It's the same thing that happens when water boils on your stove.
  v:
    tipo: casa
    foco: cocina
    lineas:
    - Like water
    - '*on your stove*'
- t: The pot keeps taking in heat while the water turns to steam.
  v:
    tipo: iconos
    iconos:
    - water_drop
    - local_fire_department
    etiquetas:
    - Water
    - Keeps taking in heat
- t: Except the refrigerant boils at a temperature far below freezing, so the winter air is enough to do it.
  v:
    tipo: iconos
    iconos:
    - severe_cold
    - bubble_chart
    etiquetas:
    - Far below freezing
    - Still boils
- t: A fan on the outdoor unit keeps pushing fresh outdoor air across the coil, so there's always more heat to grab.
  v:
    tipo: clip
    clip: aire
    lineas:
    - 'Fan:'
    - '*fresh air*'
    - more heat
- t: 'Step three: squeeze it.'
