    tipo: iconos
    iconos:
    - thermometer
    - home
    etiquetas:
    - Refrigerant
    - Hotter than indoors
- t: 'And here''s the key detail: the electricity the compressor uses isn''t wasted.'
  v:
    tipo: iconos
    iconos:
    - bolt
    - check_circle
    etiquetas:
    - Electricity
    - Not wasted
- t: It also ends up as heat in the refrigerant.
  v:
    tipo: formula
    partes:
    - Electricity
    - →
    - heat
- t: So everything that went in, the heat from outside plus the compressor's own energy, is now ready to be delivered indoors.
