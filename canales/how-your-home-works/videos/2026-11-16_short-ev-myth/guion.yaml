# Short del guionista (guiones/2026-11-16_short-ev-myth/GUION.md). Narración literal.
titulo: Is charging an EV at home always cheaper
estructura: mito-vs-realidad
formato: short
voz: {nombre: am_michael, velocidad: 1.08}
segmentos:
- t: 'Myth or reality: charging an electric car at home is always cheaper than gas.'
  v:
    tipo: iconos
    iconos: [ev_station, local_gas_station, help]
    etiquetas: ['', '', 'Always cheaper?']
- t: On national averages, a gas car costs about one thousand two hundred fifty-five dollars a year in fuel.
  v: {tipo: numero, icono: local_gas_station, valor: '$1,255/yr', etiqueta: 'Gas car, U.S. average', color: calor}
- t: Charging an electric car at home, about six hundred two.
  v:
    tipo: comparar
    a: [Electric, 602, ev_station]
    b: [Gas, 1255, local_gas_station]
    prefijo: $
    gana: a
    etiqueta: 'U.S.: $1,255 vs $602'
- t: In Washington State, the electric car saves about one thousand one hundred ninety-eight dollars a year.
  v:
    tipo: mapa
    resaltar: {WA: frio}
    lineas: ['WA: saves', '*$1,198/yr*']
- t: But in Massachusetts, where electricity costs about thirty point two cents,
  v:
    tipo: mapa
    resaltar: {WA: frio, MA: calor}
    lineas: ['MA power:', '*30.2¢/kWh*']
- t: it saves only about two hundred five.
  v: {tipo: numero, icono: savings, valor: 205, prefijo: $, sufijo: /yr, etiqueta: 'MA: saves', color: calor}
- t: And in the worst case, with charging losses added, the Massachusetts savings drop to about fifteen dollars.
  v:
    tipo: barras
    etiqueta: 'Massachusetts, saved a year'
    prefijo: $
    items:
    - [EPA rating, 205, ev_station]
    - [Worst case, 15, battery_charging_full]
- t: Basically a tie.
  v:
    tipo: iconos
    iconos: [ev_station, balance, local_gas_station]
    etiquetas: ['', 'A tie', '']
- t: 'Verdict: mostly reality, but not everywhere.'
  v:
    tipo: iconos
    iconos: [check_circle]
    etiquetas: ['Mostly reality']
- t: It depends on your electricity price.
  v:
    tipo: regla
    rango: [10, 35]
    paso: 5
    titulo: 'Power, ¢ per kWh'
    decimales: 1
    marcas:
    - [14.4, WA, frio]
    - [30.2, MA, calor]
    nota: 'Depends on your power price'
- t: So, is charging an electric car at home always cheaper than gas?
  v:
    tipo: iconos
    iconos: [ev_station, local_gas_station, help]
    etiquetas: ['', '', 'Always cheaper?']
