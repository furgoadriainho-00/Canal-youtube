- t: 'And four: what you pay for energy.'
  v:
    tipo: iconos
    iconos: [payments]
    etiquetas: ['4 · Energy prices']
- t: Nationally, regular gasoline averaged about three dollars and ten cents a gallon in twenty twenty-five, and home electricity is about eighteen point two cents per kilowatt-hour in twenty twenty-six.
  v:
    tipo: iconos
    iconos: [local_gas_station, bolt]
    etiquetas: ['Gas: $3.10/gal (2025)', 'Power: 18.2¢/kWh (2026)']
- t: That's everything we need.
  v:
    tipo: titulo
    lineas: ['That''s *everything*']
    iconos: [speed, local_gas_station, ev_station, payments]
- t: Let's start small, with every hundred miles.
  v:
    tipo: iconos
    iconos: [electric_car, local_gas_station]
    etiquetas: ['', 'Every 100 miles']
  capitulo: Every hundred miles
- t: A gas car at twenty-seven point two miles per gallon needs about three point seven gallons to go a hundred miles.
  v: {tipo: formula, partes: ['100 mi', '÷', '27.2 mpg', '=', '3.7 gal']}
- t: At the national price, that's about eleven dollars and thirty-nine cents.
  v: {tipo: formula, partes: ['3.7 gal', '×', '$3.10', '≈', '$11.39']}
- t: An electric car at thirty kilowatt-hours per hundred miles, at the national electricity price, costs about five dollars and forty-six cents for the same hundred miles.
  v: {tipo: formula, partes: ['30 kWh', '×', '$0.182', '≈', '$5.46']}
- t: So charging at home costs less than half as much per mile, on average.
  v:
    tipo: comparar
    a: [Electric, 5.46, ev_station]
    b: [Gas, 11.39, local_gas_station]
    prefijo: $
    decimales: 2
