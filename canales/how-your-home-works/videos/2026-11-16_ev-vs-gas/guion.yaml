  v: {tipo: fuente, titulo: EPA · U.S. DOT / FHWA · EIA, detalle: 'Miles driven, fuel economy, energy prices', nota: ''}
- t: And at the end, I'll give you a two-line formula to check your own state.
  v:
    tipo: mapa
    resaltar: {WA: frio, CA: frio, TX: frio, FL: frio, CO: frio, MN: frio, OH: frio, NY: frio, MA: frio}
