    iconos: [speed]
    etiquetas: ['1 · How far you drive']
- t: According to the Federal Highway Administration, the average car in America covers about eleven thousand twenty-six miles a year.
  v: {tipo: numero, icono: speed, valor: 11026, sufijo: ' mi/yr', etiqueta: 'Average car · FHWA, Highway Statistics 2024', color: frio}
- t: 'Two: how efficient a gas car is.'
  v:
    tipo: iconos
    iconos: [local_gas_station]
    etiquetas: ['2 · Gas car efficiency']
- t: The EPA says the average new vehicle from model year twenty twenty-four gets about twenty-seven point two miles per gallon in real-world driving.
  v: {tipo: numero, icono: local_gas_station, valor: 27.2, decimales: 1, sufijo: ' mpg', etiqueta: 'New vehicles, real-world · EPA Automotive Trends', color: calor}
- t: That's a record high.
  v:
    tipo: iconos
    iconos: [trending_up]
    etiquetas: ['Record high']
- t: 'Three: how efficient an electric car is.'
  v:
    tipo: iconos
    iconos: [ev_station]
    etiquetas: ['3 · Electric car efficiency']
- t: Popular twenty twenty-five models are rated by the EPA at between twenty-seven and thirty-one kilowatt-hours per hundred miles.
  v:
    tipo: barras
    etiqueta: 'EPA rating, kWh per 100 miles'
    items:
    - [Model Y LR RWD, 27, electric_car]
