- t: The government's fuel economy site defines the EPA number as the electricity the car uses to travel a hundred miles, but it doesn't spell out how charging losses are counted.
  v: {tipo: fuente, titulo: fueleconomy.gov, detalle: 'kWh the car uses to travel 100 miles', nota: 'Charging losses: not spelled out'}
