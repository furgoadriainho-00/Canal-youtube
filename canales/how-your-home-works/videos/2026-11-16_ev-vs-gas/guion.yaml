- t: An Equinox EV front-wheel drive, at thirty-one, about six hundred twenty-two.
  v:
    tipo: comparar
    a: [Model Y LR RWD, 542, electric_car]
    b: [Equinox EV FWD, 622, electric_car]
    prefijo: $
    etiqueta: 'To charge, per year'
- t: A few things are not in these numbers.
  v:
    tipo: iconos
    iconos: [ev_charger, sell, build]
    etiquetas: ['', '', 'Not included']
  capitulo: What's not included
- t: This is home charging only.
  v:
    tipo: casa
    foco: coche
    lineas: ['Home charging', '*only*']
- t: Public charging prices vary a lot, and they're not included here.
  v:
    tipo: iconos
    iconos: [ev_charger]
    etiquetas: ['Public charging']
    tachar: 0
- t: It also leaves out the price of the car, insurance and maintenance.
  v:
    tipo: iconos
    iconos: [sell, receipt_long, build]
    etiquetas: ['Car price', Insurance, Maintenance]
- t: This is purely the cost of energy to drive.
  v:
    tipo: iconos
    iconos: [bolt, local_gas_station]
    etiquetas: ['Energy', 'only']
- t: And these are averages.
  v:
    tipo: iconos
    iconos: [balance]
    etiquetas: ['Averages']
- t: If you drive more than eleven thousand miles a year, the savings grow with every mile.
  v:
    tipo: iconos
    iconos: [speed, savings]
    etiquetas: ['More miles', 'More savings']
- t: So, is charging an electric car at home cheaper than buying gas?
  v:
    tipo: comparar
    a: [Electric, '?', ev_station]
    b: [Gas, '?', local_gas_station]
  capitulo: The verdict
- t: On national averages, yes, by about six hundred fifty-four dollars a year.
  v: {tipo: numero, icono: savings, valor: 654, prefijo: $, sufijo: /yr, etiqueta: 'U.S. average: saved', color: ahorro}
- t: In Washington, by about one thousand one hundred ninety-eight.
  v:
    tipo: mapa
    resaltar: {WA: ahorro}
    lineas: ['Washington:', '*$1,198/yr*']
- t: In Massachusetts, only about two hundred five, and close to a tie in the worst case.
  v:
    tipo: mapa
    resaltar: {WA: ahorro, MA: calor}
    lineas: ['Massachusetts:', '*$205/yr*', 'worst case: a tie']
- t: Check your own two prices with the formula, and you'll know where your state lands.
  v: {tipo: formula, partes: ['your power price', '+', 'your gas price', '=', 'your answer']}
- t: And if you're wondering what else charging adds to your home's electric bill, my ranking of fifteen home appliances is on this channel.
  v:
    tipo: casa
    foco: coche
    lineas: ['Next:', '*15 appliances*', 'ranked by cost']
