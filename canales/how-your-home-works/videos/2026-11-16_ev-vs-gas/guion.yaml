segmentos:
- t: In Washington State, charging an electric car at home instead of buying gas saves about one thousand one hundred ninety-eight dollars a year.
  v:
    tipo: mapa
    resaltar: {WA: frio}
    lineas: ['Washington:', '*$1,198/yr*', saved]
  capitulo: Same car, different savings
- t: In Massachusetts, it saves about two hundred five.
  v:
    tipo: mapa
    resaltar: {WA: frio, MA: calor}
    lineas: ['WA: $1,198/yr', '*MA: $205/yr*']
- t: Same car.
  v:
    tipo: iconos
    iconos: [electric_car]
    etiquetas: ['Same car']
- t: Same miles.
  v:
    tipo: iconos
    iconos: [electric_car, speed]
    etiquetas: ['Same car', 'Same miles']
- t: So what's going on?
  v:
    tipo: comparar
