    b: [Massachusetts, 205, electric_car]
    prefijo: $
    etiqueta: Saved a year
    estatico: true
- t: In this video, I'll work out what it really costs to drive an electric car charged at home, compared with a gas car, for the whole country and for nine states.
  v:
    tipo: casa
    foco: coche
    lineas: ['Charged', '*at home*', 'vs a gas car']
  capitulo: What we'll work out
