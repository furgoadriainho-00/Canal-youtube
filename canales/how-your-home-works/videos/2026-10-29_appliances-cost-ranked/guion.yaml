- t: "Across the South, it's about seven hundred and eight."
  v: {"tipo": "barras", "items": [["Northeast", 313, "ac_unit"], ["South", 708, "ac_unit"]], "prefijo": "$", "sufijo": "/yr", "max": 831, "etiqueta": "A/C + fan, by region"}
- t: "And in Texas, Oklahoma, Arkansas and Louisiana, about eight hundred and thirty-one."
  v: {"tipo": "barras", "items": [["Northeast", 313, "ac_unit"], ["South", 708, "ac_unit"], ["TX · OK · AR · LA", 831, "ac_unit"]], "prefijo": "$", "sufijo": "/yr", "max": 831, "etiqueta": "A/C + fan, by region"}
