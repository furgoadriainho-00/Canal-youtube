# Guion del vídeo largo. Cada bloque = una frase narrada + su visual.
# t: texto que lee la voz (números en letra) · v: escena (ver motor/escenas.py) · pausa: silencio extra tras la frase (s)
titulo: "Which appliances really use the most electricity"
estructura: lista
formato: largo
voz: {nombre: am_michael, velocidad: 1.0}
segmentos:
- t: "Your dishwasher costs about twenty dollars a year to run."
  v: {"tipo": "numero", "icono": "dishwasher", "valor": 20, "prefijo": "$", "sufijo": "/yr", "etiqueta": "Dishwasher", "color": "frio"}
  capitulo: "Dishwasher vs air conditioner"
- t: "Your air conditioner? About five hundred."
  v: {"tipo": "numero", "icono": "ac_unit", "valor": 505, "prefijo": "$", "sufijo": "/yr", "etiqueta": "Air conditioning", "color": "calor"}
  pausa: 0.3
- t: "So where does your electric bill actually go?"
  v: {"tipo": "casa", "foco": "todos"}
- t: "I ranked fifteen things in the average American home by what they cost to run for a full year."
  v: {"tipo": "casa", "foco": "todos", "lineas": ["15 things,", "ranked by *yearly cost*"]}
- t: "The numbers come from the federal government's own household energy survey, not from guesses."
  v: {"tipo": "fuente", "titulo": "Residential Energy Consumption Survey", "detalle": "U.S. Energy Information Administration (EIA)", "nota": "Latest edition: 2020 · published 2023"}
- t: "For scale, the average American home buys about ten thousand eight hundred kilowatt-hours of electricity a year."
  v: {"tipo": "contador", "valor": 10791, "unidad": "kWh / year", "lineas": ["The average home:", "*10,791 kWh* a year"]}
- t: "At twenty twenty-six prices, that's almost two thousand dollars."
  v: {"tipo": "numero", "icono": "payments", "valor": 1963, "prefijo": "$", "sufijo": "/yr", "etiqueta": "10,791 kWh × $0.1819", "color": "calor"}
- t: "And a few spots on this list will probably surprise you."
  v: {"tipo": "casa", "foco": "nevera2", "lineas": ["A few *surprises*", "ahead"]}
- t: "First, a quick word on the math, so you know where every number comes from."
  v: {"tipo": "casa", "foco": "medidor", "lineas": ["How the math", "*works*"]}
  capitulo: "How the numbers work"
- t: "The survey measures how many kilowatt-hours each appliance uses in a year."
  v: {"tipo": "formula", "partes": ["kWh per year", "×", "price", "=", "yearly cost"], "revelar": 1}
- t: "And it only counts homes that actually have that appliance."
  v: {"tipo": "casa", "foco": "piscina", "lineas": ["Only homes that", "*have one*"]}
- t: "Then I multiplied that by what Americans are paying for power in twenty twenty-six: about eighteen cents per kilowatt-hour."
  v: {"tipo": "formula", "partes": ["kWh per year", "×", "$0.18", "=", "yearly cost"], "revelar": 3}
- t: "That price has jumped since the survey."
  v: {"tipo": "comparar", "a": ["2020", 13.15, "payments"], "b": ["2026", 18.19, "payments"], "prefijo": "", "sufijo": "¢/kWh", "decimales": 2}
- t: "Running the exact same fridge costs about thirty-eight percent more today than it did in twenty twenty."
  v: {"tipo": "numero", "icono": "kitchen", "valor": 38, "prefijo": "+", "sufijo": "%", "etiqueta": "Same fridge, 2020 → 2026", "color": "calor"}
- t: "Your own bill will depend on your climate and your rates. But this is the national picture."
  v: {"tipo": "casa", "foco": "todos", "lineas": ["Your home ≠ average", "the *national picture*"]}
- t: "Let's start at the bottom."
  v: {"tipo": "texto", "lineas": ["Starting at", "*#15*"]}
- t: "Number fifteen: the washing machine."
  v: {"tipo": "puesto", "n": 15, "icono": "local_laundry_service", "nombre": "Washing machine", "coste": 13, "foco": "lavadora"}
  capitulo: "#15 to #11: the cheap stuff"
- t: "The machine itself uses only about thirteen dollars of electricity a year."
  v: {"tipo": "numero", "icono": "local_laundry_service", "valor": 13, "prefijo": "$", "sufijo": "/yr", "etiqueta": "Washer motor & controls", "color": "frio"}
- t: "But that number is a little misleading."
  v: {"tipo": "casa", "foco": "lavadora", "lineas": ["But that's", "*misleading*"]}
- t: "According to Energy Star, about ninety percent of the energy it takes to run a washer goes into heating the water."
  v: {"tipo": "numero", "icono": "water_heater", "valor": 90, "prefijo": "", "sufijo": "%", "etiqueta": "of washer energy = heating water", "color": "calor", "fuente": "ENERGY STAR"}
- t: "And that cost doesn't vanish. It shows up later on this list."
  v: {"tipo": "casa", "foco": "termo", "lineas": ["That cost shows up", "*later on the list*"]}
- t: "Energy Star also says switching from hot to warm can cut that energy in half."
  v: {"tipo": "comparar", "a": ["Hot wash", 100, "local_fire_department"], "b": ["Warm wash", 50, "water_drop"], "prefijo": "", "sufijo": "%", "etiqueta": "energy use", "fuente": "ENERGY STAR"}
- t: "Number fourteen: the microwave. About nineteen dollars a year."
  v: {"tipo": "puesto", "n": 14, "icono": "microwave", "nombre": "Microwave", "coste": 19, "foco": "microondas"}
- t: "It pulls a lot of power while it runs, but it only runs for minutes at a time."
  v: {"tipo": "casa", "foco": "microondas", "lineas": ["High power,", "*short bursts*"]}
- t: "Number thirteen: the dishwasher, at about twenty dollars."
  v: {"tipo": "puesto", "n": 13, "icono": "dishwasher", "nombre": "Dishwasher", "coste": 20, "foco": "lavavajillas"}
- t: "Just like the washer, a big part of its real cost is the hot water it pulls from your water heater."
  v: {"tipo": "casa", "foco": "termo", "lineas": ["The real cost:", "*hot water*"]}
- t: "Number twelve: ceiling fans. About forty-one dollars a year, for all the fans in a home that has them."
  v: {"tipo": "puesto", "n": 12, "icono": "mode_fan", "nombre": "Ceiling fans", "coste": 41, "foco": "ventiladores"}
- t: "Keep that number in mind for when we get to air conditioning."
  v: {"tipo": "comparar", "a": ["Ceiling fans", 41, "mode_fan"], "b": ["Air conditioning", "?", "ac_unit"], "prefijo": "$", "sufijo": "/yr"}
- t: "Number eleven: the electric stove and oven. About fifty-three dollars."
  v: {"tipo": "puesto", "n": 11, "icono": "skillet", "nombre": "Stove & oven", "coste": 53, "foco": "cocina"}
- t: "Around four dollars and change per month."
  v: {"tipo": "numero", "icono": "skillet", "valor": 4.4, "prefijo": "$", "sufijo": "/mo", "etiqueta": "stove & oven, per month", "color": "frio", "decimales": 1}
- t: "That's the range and the oven only. The survey counts the microwave separately."
  v: {"tipo": "iconos", "iconos": ["skillet", "oven", "microwave"], "etiquetas": ["Cooktop", "Oven", "Not included"], "tachar": 2}
- t: "Now the list gets more interesting."
  v: {"tipo": "casa", "foco": "todos", "lineas": ["Now it gets", "*interesting*"]}
  pausa: 0.2
- t: "Number ten is something a lot of people own and completely forget about."
  v: {"tipo": "casa", "foco": "nevera2", "lineas": ["#10:", "the one you *forget*"]}
  capitulo: "#10 the forgotten fridge"
- t: "The second refrigerator. About ninety dollars a year."
  v: {"tipo": "puesto", "n": 10, "icono": "kitchen", "nombre": "Second fridge", "coste": 90, "foco": "nevera2"}
- t: "The extra fridge in the garage or the basement, usually holding drinks."
  v: {"tipo": "iconos", "iconos": ["garage", "kitchen", "local_drink"], "etiquetas": ["Garage", "Fridge #2", "Drinks"]}
- t: "Your main fridge, by comparison, costs about a hundred and twelve."
  v: {"tipo": "comparar", "a": ["Second fridge", 90, "kitchen"], "b": ["Main fridge", 112, "kitchen"], "prefijo": "$", "sufijo": "/yr"}
- t: "So the backup costs almost as much as the one you open every day."
  v: {"tipo": "numero", "icono": "kitchen", "valor": 80, "prefijo": "", "sufijo": "%", "etiqueta": "of your main fridge's cost", "color": "calor"}
- t: "If it's mostly empty, unplugging it is one of the easiest savings in the whole house."
  v: {"tipo": "casa", "foco": "nevera2", "lineas": ["Mostly empty?", "*Unplug it*"]}
- t: "Over ten years, at today's prices, that second fridge adds up to about nine hundred dollars."
  v: {"tipo": "numero", "icono": "kitchen", "valor": 900, "prefijo": "$", "sufijo": "", "etiqueta": "second fridge over 10 years", "color": "calor"}
- t: "Number nine: a separate chest or upright freezer. About a hundred and four dollars."
  v: {"tipo": "puesto", "n": 9, "icono": "ac_unit", "nombre": "Separate freezer", "coste": 104, "foco": "congelador"}
  capitulo: "#9 to #6: freezer, fridge, TVs, lighting"
- t: "Almost nine dollars a month, just to keep frozen food frozen."
  v: {"tipo": "numero", "icono": "ac_unit", "valor": 8.7, "prefijo": "$", "sufijo": "/mo", "etiqueta": "separate freezer, per month", "color": "frio", "decimales": 1}
- t: "Number eight: the main refrigerator, at a hundred and twelve."
  v: {"tipo": "puesto", "n": 8, "icono": "kitchen", "nombre": "Main fridge", "coste": 112, "foco": "nevera"}
- t: "It runs every hour of every day, and it still lands in the middle of this list."
  v: {"tipo": "casa", "foco": "nevera", "lineas": ["24 hours a day,", "*still mid-list*"]}
- t: "Number seven: your TVs, and everything plugged into them."
  v: {"tipo": "puesto", "n": 7, "icono": "tv", "nombre": "TVs & devices", "coste": 115, "foco": "tv"}
- t: "The survey counts cable boxes, streaming sticks, game consoles and sound systems too."
  v: {"tipo": "iconos", "iconos": ["tv", "router", "sports_esports", "speaker"], "etiquetas": ["TVs", "Boxes", "Consoles", "Audio"]}
- t: "All together, about a hundred and fifteen dollars a year."
  v: {"tipo": "numero", "icono": "tv", "valor": 115, "prefijo": "$", "sufijo": "/yr", "etiqueta": "TVs + everything connected", "color": "frio"}
- t: "That's a little under ten dollars a month."
  v: {"tipo": "numero", "icono": "tv", "valor": 9.6, "prefijo": "$", "sufijo": "/mo", "etiqueta": "TVs & devices, per month", "color": "frio", "decimales": 1}
- t: "Number six: lighting. About a hundred and nineteen dollars."
  v: {"tipo": "puesto", "n": 6, "icono": "lightbulb", "nombre": "Lighting", "coste": 119, "foco": "luz"}
- t: "And that's every bulb in the house, combined, for a whole year."
  v: {"tipo": "casa", "foco": "todos", "lineas": ["Every bulb,", "*combined*"]}
- t: "Roughly ten dollars a month to light your entire home."
  v: {"tipo": "numero", "icono": "lightbulb", "valor": 9.9, "prefijo": "$", "sufijo": "/mo", "etiqueta": "all lighting, per month", "color": "frio", "decimales": 1}
- t: "Number five: the clothes dryer, at a hundred and twenty-four."
  v: {"tipo": "puesto", "n": 5, "icono": "laundry", "nombre": "Clothes dryer", "coste": 124, "foco": "secadora"}
  capitulo: "#5 the clothes dryer"
- t: "It's the priciest laundry appliance by far, because its main job is making heat."
  v: {"tipo": "comparar", "a": ["Washer", 13, "local_laundry_service"], "b": ["Dryer", 124, "laundry"], "prefijo": "$", "sufijo": "/yr"}
- t: "That's more than nine times what the washer costs to run."
  v: {"tipo": "numero", "icono": "laundry", "valor": 9.5, "prefijo": "", "sufijo": "×", "etiqueta": "dryer vs washer", "color": "calor", "decimales": 1}
- t: "And now a big jump."
  v: {"tipo": "texto", "lineas": ["Now a", "*big jump*"], "icono": "trending_up"}
  capitulo: "#4 the surprise"
- t: "Number four costs more than your main fridge, and most people never even think about it."
  v: {"tipo": "casa", "foco": "deshumidificador", "lineas": ["#4 beats", "*your fridge*"]}
- t: "The dehumidifier. About a hundred and eighty-two dollars a year."
  v: {"tipo": "puesto", "n": 4, "icono": "humidity_high", "nombre": "Dehumidifier", "coste": 182, "foco": "deshumidificador"}
- t: "That's around fifteen dollars every month."
  v: {"tipo": "numero", "icono": "humidity_high", "valor": 15, "prefijo": "$", "sufijo": "/mo", "etiqueta": "dehumidifier, per month", "color": "calor"}
- t: "That's over sixty percent more than the refrigerator you use every day."
  v: {"tipo": "comparar", "a": ["Main fridge", 112, "kitchen"], "b": ["Dehumidifier", 182, "humidity_high"], "prefijo": "$", "sufijo": "/yr"}
- t: "In a damp basement, one can run for hours a day, all summer long."
  v: {"tipo": "iconos", "iconos": ["humidity_high", "schedule", "sunny"], "etiquetas": ["Damp basement", "Hours a day", "All summer"]}
- t: "If you have one, check the humidity setting. Running it drier than you need just costs money."
  v: {"tipo": "casa", "foco": "deshumidificador", "lineas": ["Check the", "*humidity setting*"]}
- t: "The top three are in a completely different league."
  v: {"tipo": "casa", "foco": "todos", "lineas": ["The top 3:", "*a different league*"]}
  pausa: 0.2
  capitulo: "The top 3"
- t: "Each one costs about half as much as the other twelve items on this list combined."
  v: {"tipo": "comparar", "a": ["#4 to #15 combined", 992, "list"], "b": ["Each top-3 item", 500, "warning"], "prefijo": "$", "sufijo": "/yr"}
- t: "Number three: the electric water heater. About four hundred and ninety-two dollars."
  v: {"tipo": "puesto", "n": 3, "icono": "water_heater", "nombre": "Electric water heater", "coste": 492, "foco": "termo"}
- t: "Remember the washing machine? This is where its hot water shows up."
  v: {"tipo": "iconos", "iconos": ["local_laundry_service", "arrow_forward", "water_heater"], "etiquetas": ["Washer", "", "Water heater"]}
- t: "Showers, dishes and laundry all get billed right here."
  v: {"tipo": "iconos", "iconos": ["shower", "dishwasher", "local_laundry_service"], "etiquetas": ["Showers", "Dishes", "Laundry"]}
- t: "That's about forty-one dollars a month, just to have hot water."
  v: {"tipo": "numero", "icono": "shower", "valor": 41, "prefijo": "$", "sufijo": "/mo", "etiqueta": "electric water heater, per month", "color": "calor"}
- t: "Which is why washing clothes in cold water is one of the easiest ways to shrink this number."
  v: {"tipo": "casa", "foco": "lavadora", "lineas": ["Cold wash =", "*smaller hot water bill*"]}
- t: "The Department of Energy says heat pump water heaters can be two to three times more efficient than standard electric ones."
  v: {"tipo": "numero", "icono": "heat_pump", "valor": 3, "prefijo": "2–", "sufijo": "×", "etiqueta": "more efficient: heat pump water heater", "color": "frio", "fuente": "U.S. Department of Energy"}
- t: "By my math, that could bring this cost down to somewhere between one hundred sixty-five and two hundred fifty dollars a year."
  v: {"tipo": "barras", "items": [["Standard electric", 492, "water_heater"], ["Heat pump (2× better)", 246, "heat_pump"], ["Heat pump (3× better)", 164, "heat_pump"]], "prefijo": "$", "sufijo": "/yr", "nota": "Estimate based on DOE efficiency range"}
- t: "Number two: electric space heating, including the fan that pushes the warm air around."
  v: {"tipo": "puesto", "n": 2, "icono": "heat", "nombre": "Electric heating", "coste": 494, "foco": "calefaccion"}
- t: "That's about four hundred and ninety-four dollars a year."
  v: {"tipo": "numero", "icono": "heat", "valor": 494, "prefijo": "$", "sufijo": "/yr", "etiqueta": "Electric heating + its fan", "color": "calor"}
- t: "This is the one that swings most with climate. In the Midwest, the average heating use is about twenty-five percent higher."
  v: {"tipo": "comparar", "a": ["U.S. average", 100, "home"], "b": ["Midwest", 125, "ac_unit"], "prefijo": "", "sufijo": "%", "etiqueta": "electric heating use"}
- t: "Including the fan, that's about six hundred and forty-four dollars a year in the Midwest."
  v: {"tipo": "comparar", "a": ["U.S. average", 494, "home"], "b": ["Midwest", 644, "ac_unit"], "prefijo": "$", "sufijo": "/yr", "etiqueta": "electric heating + fan"}
- t: "And number one."
  v: {"tipo": "texto", "lineas": ["And", "*#1*"]}
  pausa: 0.3
- t: "Air conditioning, including its fan. About five hundred and five dollars a year."
  v: {"tipo": "puesto", "n": 1, "icono": "ac_unit", "nombre": "Air conditioning", "coste": 505, "foco": "aire"}
- t: "That's more than twelve times what your ceiling fans cost."
  v: {"tipo": "comparar", "a": ["Ceiling fans", 41, "mode_fan"], "b": ["Air conditioning", 505, "ac_unit"], "prefijo": "$", "sufijo": "/yr"}
- t: "Or about forty-two dollars every single month."
  v: {"tipo": "numero", "icono": "ac_unit", "valor": 42, "prefijo": "$", "sufijo": "/mo", "etiqueta": "air conditioning, per month", "color": "calor"}
- t: "But that's the national average, and where you live changes everything."
  v: {"tipo": "casa", "foco": "aire", "lineas": ["Where you live", "*changes everything*"]}
- t: "In the Northeast, air conditioning averages about three hundred and thirteen dollars a year."
