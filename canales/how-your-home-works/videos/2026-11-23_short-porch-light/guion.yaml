- t: The incandescent costs about forty-seven dollars and eighty cents a year, at the national average electricity price.
  v: {tipo: numero, icono: wb_incandescent, valor: '$47.80/yr', etiqueta: '60 W · U.S. average price', color: calor}
- t: The LED costs about seven dollars and seventeen cents.
