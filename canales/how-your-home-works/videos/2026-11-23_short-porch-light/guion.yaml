- t: That's about forty dollars and sixty-three cents a year, from one bulb.
  v: {tipo: numero, icono: savings, valor: '−$40.63/yr', etiqueta: 'From one bulb', color: ahorro}
- t: And in twenty twenty, about thirteen point six two million homes still left an incandescent or halogen bulb on outside all night.
  v: {tipo: numero, icono: home, valor: '13.62M homes', etiqueta: '2020 · old bulb on outside all night', color: calor}
- t: So if you change just one bulb, make it the one that's on while you sleep.
