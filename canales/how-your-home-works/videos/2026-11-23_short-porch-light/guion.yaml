- t: Two identical porch lights, on all night.
  v:
    tipo: casa
    foco: luz
    lineas: ['Porch light,', '*all night*']
- t: One is a sixty-watt incandescent.
  v:
    tipo: iconos
    iconos: [wb_incandescent]
