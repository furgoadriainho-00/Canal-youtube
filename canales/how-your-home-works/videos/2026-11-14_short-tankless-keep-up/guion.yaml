    etiquetas: ['', '', 'Can it keep up?']
- t: Here's a quick test.
  v:
    tipo: iconos
    iconos: [calculate]
    etiquetas: ['Quick test']
- t: A tankless heater warms water only as fast as it flows.
  v:
    tipo: iconos
    iconos: [water_heater, water_drop]
    etiquetas: ['Tankless heater', 'Only as fast as it flows']
- t: ENERGY STAR lists typical flow rates.
  v:
    tipo: iconos
    iconos: [verified, water_drop]
    etiquetas: ['ENERGY STAR', 'Typical flow rates']
- t: A shower uses about two point five gallons per minute.
  v:
    tipo: casa
    foco: ducha
    lineas: ['Shower:', '*2.5 GPM*']
- t: A kitchen sink, two point two.
  v:
    tipo: iconos
    iconos: [faucet]
    etiquetas: ['Sink: 2.2 GPM']
- t: A clothes washer, three point three.
  v:
    tipo: iconos
    iconos: [faucet, local_laundry_service]
    etiquetas: ['Sink: 2.2 GPM', 'Washer: 3.3 GPM']
- t: Run a shower and a sink at the same time,
  v:
    tipo: iconos
    iconos: [shower, add, faucet]
    etiquetas: ['Shower', '', 'Sink']
- t: and you're asking for four point seven gallons per minute.
  v:
    tipo: formula
    partes: ['2.5', '+', '2.2', '=', '4.7 GPM']
- t: An ENERGY STAR gas tankless heater only has to deliver at least two point eight gallons per minute,
  v:
    tipo: comparar
    etiqueta: 'Minimum: 2.8 GPM'
    a: [Minimum, 2.8, water_heater]
    b: [Shower + sink, 4.7, water_drop]
